services:
  - type: web
    name: mithra-backend
    env: python
    buildCommand: "cd client-app/server && pip install -r requirements.txt"
    startCommand: "cd client-app/server && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://mithra-lifeos.com,https://www.mithra-lifeos.com"
      - key: NEON_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: mithra-frontend
    env: static
    buildCommand: "cd client-app/client && npm install && npm run build"
    staticPublishPath: client-app/client/dist
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_API_URL
        value: https://mithra-backend.onrender.com
      - key: VITE_REQUIRE_AUTH
        value: "true"
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
