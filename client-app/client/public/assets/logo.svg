<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="s">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Buddy figure -->
  <g transform="translate(256,256)" filter="url(#s)">
    <!-- Head -->
    <circle cx="0" cy="-80" r="62" fill="#fff"/>
    <!-- Friendly eyes -->
    <circle cx="-20" cy="-88" r="8" fill="#6366f1"/>
    <circle cx="20" cy="-88" r="8" fill="#6366f1"/>
    <!-- Happy smile -->
    <path d="M-18,-66 Q0,-50 18,-66" stroke="#6366f1" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-44" y="-18" width="88" height="100" rx="36" fill="#fff"/>
    <!-- Left arm waving hello -->
    <path d="M-44,10 Q-100,-30 -90,-80" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- Left hand open palm -->
    <circle cx="-90" cy="-82" r="16" fill="#fff"/>
    <!-- Right arm holding checkmark up -->
    <path d="M44,10 Q100,-30 95,-70" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
    <!-- Right hand -->
    <circle cx="95" cy="-72" r="16" fill="#fff"/>
    <!-- Productivity checkmark (held by right hand) -->
    <g transform="translate(95,-72)">
      <circle cx="0" cy="-28" r="22" fill="#34d399"/>
      <path d="M-9,-28 L-3,-22 L10,-34" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Legs -->
    <rect x="-30" y="76" width="22" height="50" rx="11" fill="#fff"/>
    <rect x="8" y="76" width="22" height="50" rx="11" fill="#fff"/>
  </g>
</svg>
