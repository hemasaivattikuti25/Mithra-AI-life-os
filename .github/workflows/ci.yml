name: Mithra CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './client-app/client/package-lock.json'
    - name: Install dependencies
      working-directory: ./client-app/client
      run: npm ci
    - name: Build
      working-directory: ./client-app/client
      run: npm run build
      env:
        VITE_API_URL: http://localhost:8000
        VITE_FIREBASE_API_KEY: dummy
        VITE_FIREBASE_AUTH_DOMAIN: dummy
        VITE_FIREBASE_PROJECT_ID: dummy

  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      working-directory: ./client-app/server
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
